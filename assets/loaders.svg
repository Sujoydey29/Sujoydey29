<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="grad-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </radialGradient>
    <radialGradient id="grad-pink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </radialGradient>
    <radialGradient id="grad-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="0.6"/></filter>
  </defs>

  <rect width="1200" height="420" fill="#0A0A0F"/>

  <!-- Cell labels at top -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#71717A" letter-spacing="2">
    <text x="200"  y="40" text-anchor="middle">MORPH</text>
    <text x="500"  y="40" text-anchor="middle">PULSE</text>
    <text x="800"  y="40" text-anchor="middle">SPLIT</text>
    <text x="1080" y="40" text-anchor="middle">DRIFT</text>
    <text x="200"  y="240" text-anchor="middle">ORBIT</text>
    <text x="500"  y="240" text-anchor="middle">RIPPLE</text>
    <text x="800"  y="240" text-anchor="middle">MERGE</text>
    <text x="1080" y="240" text-anchor="middle">SCATTER</text>
  </g>

  <!-- ROW 1 -->

  <!-- 1. MORPH: blob that morphs shape -->
  <g transform="translate(200,140)" filter="url(#soft)">
    <path fill="url(#grad-purple)">
      <animate attributeName="d"
               values="
                 M -40,-30 Q -10,-50 20,-35 Q 50,-20 45,15 Q 30,45 -5,40 Q -45,30 -50,0 Q -55,-20 -40,-30;
                 M -30,-45 Q 10,-40 35,-15 Q 55,15 35,35 Q 5,55 -25,40 Q -50,15 -45,-15 Q -45,-40 -30,-45;
                 M -45,-10 Q -25,-45 10,-40 Q 45,-25 50,5 Q 40,40 5,45 Q -30,45 -45,15 Q -50,0 -45,-10;
                 M -40,-30 Q -10,-50 20,-35 Q 50,-20 45,15 Q 30,45 -5,40 Q -45,30 -50,0 Q -55,-20 -40,-30
               " dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 2. PULSE: scaling circle -->
  <g transform="translate(500,140)">
    <circle r="30" fill="url(#grad-pink)" opacity="0.3">
      <animate attributeName="r" values="30;60;30" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="30" fill="url(#grad-pink)" opacity="0.5">
      <animate attributeName="r" values="20;50;20" dur="2s" begin="0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="25" fill="url(#grad-pink)">
      <animate attributeName="r" values="25;35;25" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 3. SPLIT: blob that splits and rejoins -->
  <g transform="translate(800,140)" filter="url(#soft)">
    <circle r="22" fill="url(#grad-cyan)">
      <animate attributeName="cx" values="0;-30;0;30;0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="22;15;22;15;22" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="22" fill="url(#grad-cyan)">
      <animate attributeName="cx" values="0;30;0;-30;0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="22;15;22;15;22" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 4. DRIFT: irregular shape drifting -->
  <g transform="translate(1080,140)" filter="url(#soft)">
    <path fill="url(#grad-purple)" d="M -25,-25 Q 0,-40 25,-25 Q 40,0 25,25 Q 0,40 -25,25 Q -40,0 -25,-25 Z">
      <animateTransform attributeName="transform" type="translate"
                        values="0,0; 15,-10; -10,12; 10,0; 0,0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="d"
               values="
                 M -25,-25 Q 0,-40 25,-25 Q 40,0 25,25 Q 0,40 -25,25 Q -40,0 -25,-25 Z;
                 M -30,-20 Q 5,-35 25,-22 Q 38,5 22,28 Q -5,38 -28,22 Q -38,-5 -30,-20 Z;
                 M -25,-25 Q 0,-40 25,-25 Q 40,0 25,25 Q 0,40 -25,25 Q -40,0 -25,-25 Z
               " dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- ROW 2 -->

  <!-- 5. ORBIT: dots orbiting center blob -->
  <g transform="translate(200,340)">
    <circle r="18" fill="url(#grad-purple)"/>
    <circle r="5" fill="#F472B6">
      <animateMotion path="M 0,-35 A 35,35 0 1,1 0,35 A 35,35 0 1,1 0,-35" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#67E8F9">
      <animateMotion path="M 0,-45 A 45,45 0 1,1 0,45 A 45,45 0 1,1 0,-45" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 6. RIPPLE: concentric ripples -->
  <g transform="translate(500,340)" fill="none" stroke="url(#grad-pink)" stroke-width="2">
    <circle r="10">
      <animate attributeName="r" values="10;55;10" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="10">
      <animate attributeName="r" values="10;55;10" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="10">
      <animate attributeName="r" values="10;55;10" dur="2.5s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="2.5s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 7. MERGE: two blobs merging and separating -->
  <g transform="translate(800,340)" filter="url(#soft)">
    <circle cx="-18" cy="0" r="20" fill="url(#grad-cyan)" opacity="0.85">
      <animate attributeName="cx" values="-25;0;-25" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="18" cy="0" r="20" fill="url(#grad-purple)" opacity="0.85">
      <animate attributeName="cx" values="25;0;25" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 8. SCATTER: cluster of dots that scatter -->
  <g transform="translate(1080,340)">
    <circle r="4" fill="url(#grad-pink)">
      <animateMotion path="M 0,0 L 30,-20 Z" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="url(#grad-purple)">
      <animateMotion path="M 0,0 L -28,-18 Z" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="url(#grad-cyan)">
      <animateMotion path="M 0,0 L -25,25 Z" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="url(#grad-pink)">
      <animateMotion path="M 0,0 L 28,22 Z" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="url(#grad-purple)">
      <animateMotion path="M 0,0 L 0,-32 Z" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="url(#grad-cyan)">
      <animateMotion path="M 0,0 L 0,32 Z" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
