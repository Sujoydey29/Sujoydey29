<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA">
        <animate attributeName="stop-color" values="#A78BFA;#EC4899;#3B82F6;#8B5CF6;#A78BFA" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#EC4899">
        <animate attributeName="stop-color" values="#EC4899;#3B82F6;#8B5CF6;#A78BFA;#EC4899" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#3B82F6">
        <animate attributeName="stop-color" values="#3B82F6;#8B5CF6;#A78BFA;#EC4899;#3B82F6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#A78BFA;#EC4899;#22D3EE" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#EC4899;#22D3EE;#8B5CF6" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softblur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="1200" height="320" fill="#0D1117"/>

  <g opacity="0.18">
    <line x1="0" y1="40" x2="1200" y2="40" stroke="#A78BFA" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="0" y1="280" x2="1200" y2="280" stroke="#EC4899" stroke-width="1" stroke-dasharray="4 8"/>
  </g>

  <path fill="url(#g1)" opacity="0.55" filter="url(#softblur)">
    <animate attributeName="d"
             values="
               M 100,160 Q 300,40 500,160 T 900,160 Q 1050,260 1180,160 L 1180,320 L 100,320 Z;
               M 100,160 Q 300,260 500,160 T 900,160 Q 1050,40 1180,160 L 1180,320 L 100,320 Z;
               M 100,160 Q 300,100 500,220 T 900,100 Q 1050,200 1180,160 L 1180,320 L 100,320 Z;
               M 100,160 Q 300,40 500,160 T 900,160 Q 1050,260 1180,160 L 1180,320 L 100,320 Z
             "
             dur="9s" repeatCount="indefinite"/>
  </path>

  <ellipse cx="240" cy="160" rx="200" ry="90" fill="url(#g2)" opacity="0.35" filter="url(#softblur)">
    <animate attributeName="rx" values="200;260;180;220;200" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="90;70;110;80;90" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="240;280;220;260;240" dur="8s" repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="960" cy="160" rx="180" ry="80" fill="url(#g1)" opacity="0.40" filter="url(#softblur)">
    <animate attributeName="rx" values="180;220;160;200;180" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="80;100;70;90;80" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="960;920;980;940;960" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <text x="600" y="155" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="86" font-weight="900" fill="#FFFFFF" text-anchor="middle" filter="url(#glow)">
    Sujoy Dey
  </text>
  <text x="600" y="205" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="22" font-weight="600" fill="#A78BFA" text-anchor="middle">
    AI Agent Architect · Builder at @72 Street AI
  </text>

  <g>
    <circle cx="120" cy="70" r="2.5" fill="#EC4899">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="60" r="2.5" fill="#22D3EE">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="260" r="2.5" fill="#A78BFA">
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="250" r="2.5" fill="#EC4899">
      <animate attributeName="opacity" values="0;1;0" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="160" r="2" fill="#8B5CF6">
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1140" cy="160" r="2" fill="#3B82F6">
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(80,140)" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" fill="#22D3EE" opacity="0.6">
    <text>&lt;/&gt;</text>
    <animateTransform attributeName="transform" type="translate" values="80,140;80,150;80,140" dur="3s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(1080,180)" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" fill="#EC4899" opacity="0.6">
    <text>{ }</text>
    <animateTransform attributeName="transform" type="translate" values="1080,180;1080,170;1080,180" dur="3.5s" repeatCount="indefinite"/>
  </g>
</svg>
