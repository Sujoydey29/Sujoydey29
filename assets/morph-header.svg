<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899">
        <animate attributeName="stop-color" values="#EC4899;#A78BFA;#8B5CF6;#EC4899" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="60%" stop-color="#A78BFA">
        <animate attributeName="stop-color" values="#A78BFA;#8B5CF6;#EC4899;#A78BFA" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.85">
        <animate attributeName="stop-color" values="#7C3AED;#A78BFA;#8B5CF6;#7C3AED" dur="10s" repeatCount="indefinite"/>
      </stop>
    </radialGradient>
    <filter id="softblur"><feGaussianBlur stdDeviation="1.5"/></filter>
    <filter id="textglow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="#0D1117"/>

  <!-- Single elegant orb, slightly off-center, gently morphing -->
  <g filter="url(#softblur)">
    <ellipse cx="780" cy="180" rx="140" ry="120" fill="url(#orb)">
      <animate attributeName="rx" values="140;155;135;145;140" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="120;110;130;115;120" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="780;790;770;785;780" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="180;175;185;178;180" dur="13s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Title -->
  <text x="600" y="170"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif"
        font-size="92" font-weight="900" fill="#FFFFFF" text-anchor="middle"
        filter="url(#textglow)">
    Sujoy Dey
  </text>

  <!-- Subtitle -->
  <text x="600" y="220"
        font-family="ui-monospace, 'SF Mono', Menlo, monospace"
        font-size="20" font-weight="500" fill="#9CA3AF" text-anchor="middle">
    AI Agent Architect · Building Autonomous Systems
  </text>
</svg>
