name: Generate Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Metrics — classic stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Sujoydey29
          filename: metrics/metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          config_padding: 0, 8 + 11%

      - name: Metrics — terminal-style activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Sujoydey29
          filename: metrics/metrics.terminal.svg
          template: terminal
          base: header, activity, community
          config_timezone: Asia/Kolkata
